[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofusion"
version = "0.1.0"
description = "Research scaffold for asynchronous tactile contact memory and unified action decoding"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
neurofusion = "neurofusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
hardware = ["dynamixel-sdk==3.8.4", "pyserial==3.5"]
models = [
    "torch==2.6.0", "torchvision==0.21.0", "numpy>=1.26,<3", "pillow>=10",
    "einops==0.8.1", "diffusers==0.32.2", "safetensors>=0.5,<1",
    "rich==13.9.4", "omegaconf==2.3.0", "opencv-python-headless==4.11.0.86",
    "lightning==2.5.0.post0",
]
